<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYRO — The robot marketplace</title>
<meta name="description" content="BYRO is the marketplace for the household robots people actually live with. Vacuums, mowers, companions, humanoids — every maker in one cart.">
<meta name="theme-color" content="#FAFAF7">

<!-- Dev: do not cache. Edits to app.js / data.js / styles.css show up on normal reload. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=3">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css?v=18">

<!-- Spline Runtime SDK: gives us programmatic access to the scene (variables + named objects) -->
<script type="importmap">
{
  "imports": {
    "@splinetool/runtime": "https://unpkg.com/@splinetool/runtime@1.9.48/build/runtime.js"
  }
}
</script>

<script>
  // Editable hero 3D scene. Swap to any prod.spline.design/.../scene.splinecode URL.
  window.BYRO_HERO_SCENE = "https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode";

  // Color targets applied to anything in the scene named like specific body parts.
  // The Runtime SDK exposes only what the scene's original creator named — see app.js
  // for the matcher. Currently: only recoloring eyes (blue). Everything else stays
  // as the scene was originally rendered.
  window.BYRO_HERO_TINT = {
    eye: '#2C7FE5'  // BYRO blue for eyes only
  };
</script>

<meta property="og:title" content="BYRO — The robot marketplace">
<meta property="og:description" content="Vacuums, mowers, companions, humanoids. One marketplace, every maker, real reviews from real homes.">
<meta property="og:type" content="website">
</head>
<body>
<div id="root"></div>

<script src="data.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
